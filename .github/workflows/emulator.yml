name: Compatibility probe (emulators)

# Boots stock Android emulators and records whether the app starts and whether the official
# site renders in each engine. Run it by hand (Actions tab -> Run workflow); it also runs when
# the probe itself changes. Results: job summaries and the "probe-*" artifacts.
#
# Limits, stated plainly: emulators are not real phones; stock images carry the WebView the
# Android release shipped with, not the newest one a real phone can install; the probe never
# signs in.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to open
        default: https://claude.ai/login
  push:
    paths:
      - .github/workflows/emulator.yml
      - scripts/probe.sh
      - scripts/ui-walk.py

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleLiteDebug
      - run: ./gradlew --no-daemon :app:assembleGeckoDebug -Pabi=x86_64
      - run: |
          mkdir apks
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk apks/lite.apk
          cp app/build/outputs/apk/gecko/debug/app-gecko-debug.apk apks/gecko.apk
      - uses: actions/upload-artifact@v4
        with:
          name: probe-apks
          path: apks
          retention-days: 3

  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 21, target: default, gecko: false }
          - { api: 23, target: default, gecko: false }
          - { api: 24, target: default, gecko: false }
          - { api: 26, target: default, gecko: true }
          - { api: 28, target: default, gecko: true }
          - { api: 30, target: google_apis, gecko: true }
          - { api: 33, target: google_apis, gecko: true }
          - { api: 35, target: google_apis, gecko: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: probe-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROBE_URL: ${{ inputs.url || 'https://claude.ai/login' }}
          GECKO: ${{ matrix.gecko }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            UI_WALK=true scripts/probe.sh apks/lite.apk webview api${{ matrix.api }}-webview || echo "PROBE_FAILED webview" >> out/failed.txt
            if [ "$GECKO" = "true" ]; then scripts/probe.sh apks/gecko.apk gecko api${{ matrix.api }}-gecko || echo "PROBE_FAILED gecko" >> out/failed.txt; fi
            if [ -f out/failed.txt ]; then cat out/failed.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-api${{ matrix.api }}
          path: out
          retention-days: 14

  # One place to read every result.
  summary:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-api*
          path: results
      - name: All results
        run: |
          for f in $(ls results/*/*-result.txt | sort -V); do
            echo "##### $(basename "$f" -result.txt)"
            cat "$f"
            walk="${f%-result.txt}-ui-walk.txt"
            [ -f "$walk" ] && tail -n 3 "$walk"
            echo
          done | tee -a "$GITHUB_STEP_SUMMARY"

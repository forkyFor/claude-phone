name: Release

# Pushing a tag like v0.1.0 builds the APKs and publishes a GitHub Release with their
# SHA-256 fingerprints. Nothing is published anywhere else.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Prepare signing key (only if the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testLiteDebugUnitTest

      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: scripts/build-apks.sh

      - name: Write release notes
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            if [ "$(cat dist/.build-type)" = release ]; then
              echo "**Signed release build.**"
            else
              echo "> **DEBUG BUILD.** No signing key was configured for this repository, so these APKs are signed with a throw-away debug key. They work, but a later version cannot be installed over them (uninstall first, which signs you out). See \`docs/en/SIGNING.md\`."
            fi
            echo
            echo "Independent project, not affiliated with Anthropic. Install guide: \`docs/en/INSTALL.md\` · \`docs/it/INSTALL.md\`."
            echo
            echo "### Which file?"
            echo "- **lite**: Android 5.0+, uses the phone's own web engine. Start here."
            echo "- **gecko-arm64-v8a / gecko-armeabi-v7a**: Android 8.0+, adds the GeckoView engine (large)."
            echo
            echo "### SHA-256 of the APK files"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "### Signing certificate (SHA-256)"
            echo '```'
            "$APKSIGNER" verify --print-certs dist/*-lite*.apk | grep -i "SHA-256" | head -1
            echo '```'
          } > notes.md
          cat notes.md

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Works whether the tag was pushed with git or created from the GitHub website.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
              --title "OldPhoneClaude ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

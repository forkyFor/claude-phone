name: Build

# Every push and pull request: unit tests, lint, and all APKs as a downloadable artifact.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in GitHub Secrets. Pull requests from forks never see it.
      - name: Prepare signing key (only if the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests and lint
        run: ./gradlew --no-daemon :app:testLiteDebugUnitTest :app:lintLiteDebug :app:lintGeckoDebug

      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: scripts/build-apks.sh

      - name: Summary
        run: |
          {
            if [ "$(cat dist/.build-type)" = release ]; then
              echo "## Signed release APKs"
            else
              echo "## DEBUG APKs (no signing secret configured)"
              echo "These are signed with a throw-away debug key: fine for trying the app, but a later build cannot be installed over them. See docs/en/SIGNING.md."
            fi
            echo
            echo '| APK | Size | SHA-256 |'
            echo '|---|---|---|'
            while read -r sum name; do
              echo "| $name | $(du -h "dist/$name" | cut -f1) | \`$sum\` |"
            done < dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: OldPhoneClaude-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 30
